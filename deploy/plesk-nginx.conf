# Plesk → Apache & nginx Settings → Additional nginx directives
# Node.js extension already proxies to the app; this denies raw file leaks.

location ^~ /data/ { deny all; return 404; }
location ^~ /node_modules/ { deny all; return 404; }
location ^~ /.next/ { deny all; return 404; }
location ^~ /.env { deny all; return 404; }
